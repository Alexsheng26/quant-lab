[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

markers =
    network: 需要访问真实外网（默认被 conftest 拦截，CI 不跑）
    js: 前端 JS 单元测试，需要 playwright + chromium
    a11y: 无障碍审计，需要 playwright + chromium

filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
